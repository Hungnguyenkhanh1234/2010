<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Chúc Mừng 20/10 💐</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    text-align: center;
    transition: background 2s ease;
  }

  #container {
    text-align: center;
  }

  button {
    background: linear-gradient(90deg, #ff7eb3, #ff758c);
    color: white;
    border: none;
    padding: 15px 40px;
    font-size: 1.3rem;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 20px rgba(255, 182, 193, 0.8);
  }

  button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px rgba(255, 105, 180, 1);
  }

  h1 {
    font-size: 3rem;
    background: linear-gradient(90deg, #ff66b2, #ff1493, #ff66b2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: glow 3s infinite alternate;
    margin-bottom: 10px;
  }

  @keyframes glow {
    from { text-shadow: 0 0 10px #ff69b4; }
    to { text-shadow: 0 0 25px #ff1493; }
  }

  p {
    color: white;
    font-size: 1.3rem;
    text-shadow: 0 0 8px #ff69b4;
    max-width: 600px;
    margin: 0 auto;
  }

  .hidden {
    display: none;
  }

  .fade-in {
    animation: fadeInScale 1.5s ease forwards;
  }

  @keyframes fadeInScale {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
  }

  .flower, .heart {
    position: absolute;
    top: -50px;
    animation: fall 6s linear infinite;
    opacity: 0.9;
    pointer-events: none;
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  audio {
    display: none;
  }
</style>
</head>
<body>

  <div id="container">
    <button id="startBtn">💌 Nhấn để nhận lời chúc 💖</button>

    <div id="message" class="hidden">
      <h1>💐 Chúc Mừng Ngày 20/10 💖</h1>
      <p>Chúc bạn luôn xinh đẹp, hạnh phúc và được yêu thương như những đóa hoa 🌸  
      Cảm ơn vì đã luôn tỏa sáng, dịu dàng và tuyệt vời như thế 💕</p>
    </div>
  </div>

  <audio id="bgm" loop>
    <source src="https://cdn.pixabay.com/download/audio/2023/05/15/audio_25ccdb12b3.mp3?filename=romantic-piano-146999.mp3" type="audio/mpeg">
  </audio>

  <!-- Thư viện pháo giấy -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const flowers = ['🌸','🌷','🌹','💐','🌺','🌼'];
    const hearts = ['💖','💗','💓','💞','💕'];
    const btn = document.getElementById('startBtn');
    const msg = document.getElementById('message');
    const bgm = document.getElementById('bgm');

    function createFallingEmoji(list, className) {
      const emoji = document.createElement('div');
      emoji.classList.add(className);
      emoji.textContent = list[Math.floor(Math.random() * list.length)];
      emoji.style.left = Math.random() * 100 + 'vw';
      emoji.style.animationDuration = (4 + Math.random() * 6) + 's';
      emoji.style.fontSize = (1 + Math.random() * 1.8) + 'rem';
      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 10000);
    }

    function fireConfetti() {
      const duration = 2000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 10,
          angle: 60,
          spread: 70,
          origin: { x: 0 },
          colors: ['#ff69b4', '#ffb6c1', '#ffc0cb']
        });
        confetti({
          particleCount: 10,
          angle: 120,
          spread: 70,
          origin: { x: 1 },
          colors: ['#ff69b4', '#ffb6c1', '#ffc0cb']
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    btn.addEventListener('click', () => {
      btn.classList.add('hidden');
      bgm.play();
      fireConfetti();

      setTimeout(() => {
        msg.classList.remove('hidden');
        msg.classList.add('fade-in');
        document.body.style.background = 'linear-gradient(135deg, #ffb6c1, #ffa6d1, #ff8fc7)';

        // hoa rơi
        setInterval(() => createFallingEmoji(flowers, 'flower'), 400);

        // tim bay
        setTimeout(() => {
          for (let i = 0; i < 30; i++) {
            setTimeout(() => createFallingEmoji(hearts, 'heart'), i * 150);
          }
        }, 1000);
      }, 2000);
    });
  </script>

</body>
</html>
